    // ==================== EXPORT HELPERS ====================
    const exportToExcel = (data, filename) => {
      const headers = "ردیف,کد,نام سفارش,نام خروجی,واحد,مجموع,ارسالی,مانده,مازاد,وضعیت,توضیحات\n";
      const safe = s => `"${String(s || '').replace(/"/g, '""')}"`;
      const rows = data.map(i => [i.row, i.code, safe(i.order_name), safe(i.output_name), i.unit, i.total_order, i.total_sent, i.remaining, i.excess, safe(i.status), safe(i.notes)].join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + headers + rows], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename + '.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    };

    const exportToPDF = (data, title) => {
      const rows = data.map(i => `<tr><td style="padding:6px;border:1px solid #ddd;">${i.row}</td><td style="padding:6px;border:1px solid #ddd;">${i.code}</td><td style="padding:6px;border:1px solid #ddd;">${i.order_name}</td><td style="padding:6px;border:1px solid #ddd;">${i.output_name}</td><td style="padding:6px;border:1px solid #ddd;text-align:center;">${fmt(i.total_order)}</td><td style="padding:6px;border:1px solid #ddd;text-align:center;">${fmt(i.total_sent)}</td><td style="padding:6px;border:1px solid #ddd;text-align:center;">${fmt(i.remaining)}</td><td style="padding:6px;border:1px solid #ddd;text-align:center;">${i.status}</td></tr>`).join('');
      const html = `<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><title>${title}</title><style>@page { size: A4 landscape; margin: 10mm; } body { font-family: Tahoma; direction: rtl; } table { width: 100%; border-collapse: collapse; font-size: 10px; } thead th { background: #1e293b; color: white; padding: 8px; }</style></head><body><h2 style="text-align:center;">${title}</h2><table><thead><tr><th>ردیف</th><th>کد</th><th>نام سفارش</th><th>نام خروجی</th><th>مجموع</th><th>ارسالی</th><th>مانده</th><th>وضعیت</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
      const win = window.open('', '_blank');
      if (win) { win.document.write(html); win.document.close(); setTimeout(() => win.print(), 500); }
    };

    // ==================== SearchableSelect ====================
    const SearchableSelect = ({ options, value, onChange, placeholder }) => {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');
      const ref = useRef(null);
      useEffect(() => {
        const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setIsOpen(false); };
        document.addEventListener("mousedown", h);
        return () => document.removeEventListener("mousedown", h);
      }, []);
      const filtered = useMemo(() => {
        if (!search) return options;
        const q = search.toLowerCase();
        return options.filter(o => o.label.toLowerCase().includes(q) || o.value.toLowerCase().includes(q));
      }, [options, search]);
      const sel = options.find(o => o.value === value);
      return (
        <div ref={ref} className="relative w-full">
          <div onClick={() => setIsOpen(!isOpen)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer flex justify-between items-center text-xs">
            <span className={sel ? 'text-slate-900' : 'text-slate-400'}>{sel ? sel.label : placeholder}</span>
            <span className="text-slate-400">▼</span>
          </div>
          {isOpen && (
            <div className="absolute z-50 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-60 overflow-y-auto">
              <div className="p-2 sticky top-0 bg-white border-b border-slate-100">
                <input autoFocus value={search} onChange={e => setSearch(e.target.value)} placeholder="جستجو..." className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs outline-none focus:border-indigo-500" />
              </div>

    // ==================== FIFO LOGIC HELPER ====================
    // کسر مقدار از سفارشات قدیمی‌تر بر اساس تاریخ
    const applyFIFO = (orders, code, qtyToShip) => {
      // پیدا کردن همه سفارشات دارای مانده با این کد
      let candidates = orders.filter(o => o.code === code && o.remaining > 0);
      
      // مرتب‌سازی بر اساس تاریخ (قدیمی‌ترها اول)
      candidates.sort((a, b) => new Date(a.invoiceDate).getTime() - new Date(b.invoiceDate).getTime());

      let remainingToShip = qtyToShip;
      const updatedOrders = [...orders];

      for (let i = 0; i < candidates.length; i++) {
        if (remainingToShip <= 0) break;
        
        const order = candidates[i];
        const orderIndex = updatedOrders.findIndex(o => o.row === order.row);
        const deduct = Math.min(order.remaining, remainingToShip);
        
        // محاسبه مجدد مقادیر
        const newTotalSent = Number((order.total_sent + deduct).toFixed(2));
        const newRemaining = Math.max(0, Number((order.total_order - newTotalSent).toFixed(2)));
        const newExcess = newTotalSent > order.total_order ? Number((newTotalSent - order.total_order).toFixed(2)) : 0;
        const newStatus = newRemaining === 0 ? (newExcess > 0 ? 'ارسال مازاد' : 'تکمیل شده') : 'دارای مانده';

        updatedOrders[orderIndex] = {
          ...order,
          new_sent: order.new_sent + deduct,
          total_sent: newTotalSent,
          remaining: newRemaining,
          excess: newExcess,
          status: newStatus
        };

        remainingToShip -= deduct;
      }

      // اگر مقدار درخواستی بیشتر از کل موجودی بود، مابقی به عنوان مازاد به آخرین سفارش (یا یک سفارش جدید) اضافه می‌شود
      // در این نسخه فرض می‌کنیم موجودی کافی وجود دارد یا اجازه مازاد را می‌دهیم.
      // برای سادگی، اگر remainingToShip > 0 باشد، آن را به عنوان ارسال مازاد در یک ردیف جدید ثبت می‌کنیم (یا به سفارش آخر اضافه می‌کنیم)
      if (remainingToShip > 0) {
         // ثبت مازاد (اختیاری: می‌توان یک سفارش جدید با کد و نام کالا ایجاد کرد)
         const lastOrder = candidates[candidates.length - 1];
         if (lastOrder) {
             const idx = updatedOrders.findIndex(o => o.row === lastOrder.row);
             const newTotalSent = Number((updatedOrders[idx].total_sent + remainingToShip).toFixed(2));
             const newExcess = newTotalSent > updatedOrders[idx].total_order ? Number((newTotalSent - updatedOrders[idx].total_order).toFixed(2)) : 0;
             updatedOrders[idx] = {
                 ...updatedOrders[idx],
                 new_sent: updatedOrders[idx].new_sent + remainingToShip,
                 total_sent: newTotalSent,
                 excess: newExcess,
                 status: 'ارسال مازاد'
             };
         }
      }

      return updatedOrders;
    };

    // ==================== MISSING COMPONENTS FIX ====================

    const Letters = ({ currentRole, letters = [], setLetters, users = {} }) => {
      const [subject, setSubject] = useState("");
      const [message, setMessage] = useState("");
      const [recipients, setRecipients] = useState([]);
      const [attachments, setAttachments] = useState([]);
      const [notice, setNotice] = useState("");
      const [attachmentError, setAttachmentError] = useState("");

      const roleLabels = Object.fromEntries(
        Object.entries(users).map(([key, user]) => [key, user.label || key])
      );
      const availableRecipients = Object.entries(users).filter(([key]) => key !== currentRole);
      const allSelected = availableRecipients.length > 0 && availableRecipients.every(([key]) => recipients.includes(key));

      const toggleRecipient = (key) => setRecipients(prev => prev.includes(key) ? prev.filter(x => x !== key) : [...prev, key]);
      const toggleAllRecipients = () => setRecipients(allSelected ? [] : availableRecipients.map(([key]) => key));

      const addAttachments = async (files) => {
        setAttachmentError("");
        const chosen = Array.from(files || []);
        if (attachments.length + chosen.length > 5) {
          setAttachmentError("حداکثر ۵ فایل برای هر نامه قابل پیوست است.");
          return;
        }
        const maxBytes = 1024 * 1024;
        const oversized = chosen.find(file => file.size > maxBytes);
        if (oversized) {
          setAttachmentError(`حجم فایل «${oversized.name}» بیشتر از ۱ مگابایت است.`);
          return;
        }
        const readFile = file => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve({ name: file.name, type: file.type || "application/octet-stream", size: file.size, data: reader.result });
          reader.onerror = () => reject(new Error("خواندن فایل ناموفق بود."));
          reader.readAsDataURL(file);
        });
        try {
          const loaded = await Promise.all(chosen.map(readFile));
          setAttachments(prev => [...prev, ...loaded]);
        } catch (err) {
          setAttachmentError(err.message || "خطا در خواندن فایل.");
        }
      };

      const submitLetter = (e) => {
        e.preventDefault();
        if (!subject.trim() || !message.trim() || recipients.length === 0) return;
        const newLetter = {
          id: Date.now(),
          subject: subject.trim(),
          message: message.trim(),
          sender: currentRole,
          recipient: recipients[0], // compatibility with older records
          recipients: [...recipients],
          date: nowFa(),
          read: false,
          attachments: attachments.map(file => ({ ...file }))
        };
        setLetters(prev => [newLetter, ...(Array.isArray(prev) ? prev : [])]);
        setSubject("");
        setMessage("");
        setRecipients([]);
        setAttachments([]);
        setNotice("نامه به واحدهای انتخاب‌شده ارسال شد.");
        setTimeout(() => setNotice(""), 2500);
      };

      const visibleLetters = (Array.isArray(letters) ? letters : []).filter(letter => {
        const targets = Array.isArray(letter.recipients) ? letter.recipients : [letter.recipient].filter(Boolean);
        return letter.sender === currentRole || targets.includes(currentRole);
      });

      return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4">

              <Field label="گیرندگان / واحدها" required>
                <div className="border border-slate-200 rounded-lg bg-slate-50 p-2 space-y-2">
                  <label className="flex items-center gap-2 font-bold text-indigo-700 border-b pb-2">
                    <input type="checkbox" checked={allSelected} onChange={toggleAllRecipients} /> انتخاب همه واحدها
                  </label>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {availableRecipients.map(([key, user]) => (
                      <label key={key} className="flex items-center gap-2 p-2 bg-white border rounded-md cursor-pointer">
                        <input type="checkbox" checked={recipients.includes(key)} onChange={() => toggleRecipient(key)} />
                        <span>{user.label || key}</span>
                      </label>
                    ))}
                  </div>
                  <p className="text-slate-500">انتخاب‌شده: {recipients.length} واحد</p>
                </div>
              </Field>
              <Field label="موضوع" required>
                <input value={subject} onChange={e => setSubject(e.target.value)} required className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
              </Field>
              <Field label="متن نامه" required>
                <textarea value={message} onChange={e => setMessage(e.target.value)} required rows={5} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg resize-y" />
              </Field>
              <Field label="پیوست فایل (حداکثر ۵ فایل، هر فایل تا ۱ مگابایت)">
                <input type="file" multiple onChange={e => { addAttachments(e.target.files); e.target.value = ''; }} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
              </Field>
              {attachmentError && <p className="text-rose-600">{attachmentError}</p>}
              {attachments.length > 0 && <div className="space-y-1">
                {attachments.map((file, i) => <div key={i} className="flex items-center justify-between gap-2 bg-indigo-50 border border-indigo-100 rounded p-2">
                  <span className="truncate">📎 {file.name} <span className="text-slate-500">({Math.ceil(file.size / 1024)} KB)</span></span>
                  <button type="button" onClick={() => setAttachments(prev => prev.filter((_, index) => index !== i))} className="text-rose-600 font-bold">حذف</button>
                </div>)}
              </div>}
              <button type="submit" disabled={!subject.trim() || !message.trim() || recipients.length === 0} className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-300 text-white py-2 rounded-lg font-bold">ثبت و ارسال نامه</button>
            </form>
          </div>
          <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
            <h3 className="font-bold text-sm mb-3">نامه‌های کارتابل</h3>
            {visibleLetters.length === 0 ? (
              <p className="text-xs text-slate-400 text-center py-8">نامه‌ای ثبت نشده است.</p>
            ) : (
              <div className="space-y-2 max-h-[600px] overflow-y-auto">
                {visibleLetters.map(letter => {
                  const targets = Array.isArray(letter.recipients) ? letter.recipients : [letter.recipient].filter(Boolean);
                  return <div key={letter.id} className="bg-slate-50 border border-slate-100 rounded-lg p-3 text-xs">
                    <div className="flex justify-between gap-2 mb-1">
                      <strong>{letter.subject || "بدون موضوع"}</strong>
                      <span className="text-slate-400 whitespace-nowrap">{letter.date || ""}</span>
                    </div>
                    <p className="text-slate-500 mb-2">فرستنده: {roleLabels[letter.sender] || letter.sender}</p>
                    <p className="text-slate-500 mb-2">گیرندگان: {targets.map(key => roleLabels[key] || key).join("، ")}</p>
                    <p className="whitespace-pre-wrap leading-6">{letter.message || letter.body || ""}</p>
                    {Array.isArray(letter.attachments) && letter.attachments.length > 0 && <div className="mt-3 pt-2 border-t border-slate-200">
                      <p className="font-bold mb-1 flex items-center gap-1"><Icon name="paperclip" className="w-3.5 h-3.5" /> فایل‌های پیوست</p>
                      <div className="flex flex-col gap-1">
                        {letter.attachments.map((file, i) => <a key={i} href={file.data} download={file.name} target="_blank" rel="noreferrer" className="text-indigo-600 underline break-all">📎 {file.name} ({Math.ceil((file.size || 0) / 1024)} KB)</a>)}
                      </div>
                    </div>}
                  </div>;
                })}
              </div>
            )}
          </div>
        </div>
      );
    };

    // ==================== MAIN APP ====================

          groups[id].items.push(order);
        });
        return Object.values(groups).sort((a, b) => String(b.date).localeCompare(String(a.date)));
      }, [orders]);

      const invoiceCatalog = useMemo(() => {
        const seen = new Set();
        return orders.filter(o => {
          const key = `${o.code}|${o.order_name}|${o.output_name}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }, [orders]);

      const addInvoiceItem = (isEditing = false) => {
        const catalogItem = invoiceCatalog.find(o => String(o.row) === String(invoiceProductRow));
        const qty = Number(invoiceProductQty);
        if (!catalogItem) return setToast({ type: 'error', msg: 'کالا را انتخاب کنید.' });
        if (!Number.isFinite(qty) || qty <= 0) return setToast({ type: 'error', msg: 'مقدار سفارش معتبر وارد کنید.' });
        const item = { catalogRow: catalogItem.row, code: catalogItem.code, order_name: catalogItem.order_name, output_name: catalogItem.output_name, unit: catalogItem.unit, qty };
        if (isEditing) setEditInvoice(prev => ({ ...prev, items: [...prev.items, item] }));
        else setInvoiceCart(prev => [...prev, item]);
        setInvoiceProductRow(''); setInvoiceProductQty('');
      };

      const createInvoice = (e) => {
        e.preventDefault();
        const invoiceId = invoiceDraft.id.trim();
        if (!invoiceId || !invoiceDraft.date || invoiceCart.length === 0) return setToast({ type: 'error', msg: 'کد، تاریخ و حداقل یک کالا لازم است.' });
        if (orders.some(o => (o.invoiceId || 'INITIAL') === invoiceId)) return setToast({ type: 'error', msg: 'این کد فاکتور قبلاً ثبت شده است.' });
        const startRow = Math.max(0, ...orders.map(o => Number(o.row) || 0)) + 1;
        const newRows = invoiceCart.map((item, index) => ({
          row: startRow + index, code: item.code, order_name: item.order_name, output_name: item.output_name, unit: item.unit,
          total_order: item.qty, prev_sent: 0, new_sent: 0, total_sent: 0, remaining: item.qty, excess: 0,
          status: 'دارای مانده', notes: '', invoiceId, invoiceDate: invoiceDraft.date
        }));
        setOrders(prev => [...prev, ...newRows]);
        logActivity('ثبت فاکتور', `فاکتور ${invoiceId} با ${newRows.length} قلم کالا ثبت شد.`);
        setInvoiceModal(false); setInvoiceDraft({ id: '', date: todayFa() }); setInvoiceCart([]);
        setToast({ type: 'success', msg: 'فاکتور جدید ثبت شد.' });
      };

      const openEditInvoice = (invoice) => setEditInvoice({ originalId: invoice.id, id: invoice.id, date: invoice.date, items: invoice.items.map(item => ({ catalogRow: item.row, code: item.code, order_name: item.order_name, output_name: item.output_name, unit: item.unit, qty: item.total_order })) });

      const saveInvoiceEdit = (e) => {
        e.preventDefault();
        if (!editInvoice.id.trim() || !editInvoice.date || editInvoice.items.length === 0) return setToast({ type: 'error', msg: 'کد، تاریخ و حداقل یک قلم کالا لازم است.' });
        const oldId = editInvoice.originalId || editInvoice.id;
        const duplicate = orders.some(o => (o.invoiceId || 'INITIAL') === editInvoice.id && (o.invoiceId || 'INITIAL') !== oldId);
        if (duplicate) return setToast({ type: 'error', msg: 'کد فاکتور تکراری است.' });
        const currentRows = orders.filter(o => (o.invoiceId || 'INITIAL') === oldId);
        const otherRows = orders.filter(o => (o.invoiceId || 'INITIAL') !== oldId);
        const updatedRows = editInvoice.items.map((item, index) => {
          const prior = currentRows.find(o => o.row === item.catalogRow && o.code === item.code) || currentRows.find(o => o.code === item.code && o.order_name === item.order_name) || {};
          const total = Number(item.qty) || 0;
          const sent = Number(prior.total_sent) || 0;
          const remaining = Math.max(0, total - sent);
          const excess = Math.max(0, sent - total);
          return { ...prior, row: prior.row || (Math.max(0, ...orders.map(o => Number(o.row) || 0)) + index + 1), code: item.code, order_name: item.order_name, output_name: item.output_name, unit: item.unit, total_order: total, total_sent: sent, remaining, excess, status: remaining > 0 ? 'دارای مانده' : excess > 0 ? 'ارسال مازاد' : 'تکمیل شده', invoiceId: editInvoice.id.trim(), invoiceDate: editInvoice.date };
        });
        setOrders([...otherRows, ...updatedRows]);
        logActivity('ویرایش فاکتور', `فاکتور ${oldId} به ${editInvoice.id} ویرایش شد.`);
        setEditInvoice(null); setToast({ type: 'success', msg: 'فاکتور ویرایش شد.' });
      };

      const deleteInvoice = (invoice) => {
        if (!window.confirm(`فاکتور ${invoice.id} و تمام ${invoice.items.length} قلم آن حذف شود؟ این عملیات برگشت‌پذیر نیست.`)) return;
        setOrders(prev => prev.filter(o => (o.invoiceId || 'INITIAL') !== invoice.id));
        logActivity('حذف فاکتور', `فاکتور ${invoice.id} و ${invoice.items.length} قلم کالا حذف شد.`);
        setToast({ type: 'success', msg: 'فاکتور و اقلام آن حذف شد.' });
      };

      const handleSaveOrder = (e) => {
        e.preventDefault();
        setOrders(orders.map(o => o.row === editOrder.row ? editOrder : o));
        logActivity('ویرایش سفارش', `سفارش ${editOrder.code} ویرایش شد.`);
        setEditOrder(null);
        setToast({ type: 'success', msg: 'سفارش ویرایش شد.' });
      };

      const handleDeleteOrder = (order) => {
        if (!window.confirm(`آیا از حذف کامل سفارش ${order.code} - ${order.order_name} مطمئن هستید؟`)) return;
        setOrders(orders.filter(o => o.row !== order.row));
        logActivity('حذف سفارش', `سفارش ${order.code} - ${order.order_name} حذف شد.`);
        setToast({ type: 'success', msg: 'سفارش حذف شد.' });
      };

      const handleSaveRm = (e) => {
        e.preventDefault();
        const minStock = Number(rmForm.minStock);
        const currentStock = Number(rmForm.currentStock);
        const newItem = {
          id: editRm && editRm.id ? editRm.id : Date.now(),
          code: rmForm.code, name: rmForm.name, unit: rmForm.unit,
          minStock, currentStock, reorderPoint: calcRP(minStock),
          supplier: rmForm.supplier, lastUpdate: todayFa()
        };
        if (editRm && editRm.id) {
          setRawMaterials(rawMaterials.map(r => r.id === editRm.id ? newItem : r));
          logActivity('ویرایش ماده اولیه', `ماده اولیه ${rmForm.name} ویرایش شد.`);
        } else {
          setRawMaterials([newItem, ...rawMaterials]);
          logActivity('افزودن ماده اولیه', `ماده اولیه ${rmForm.name} اضافه شد.`);
        }
        setEditRm(null);
        setToast({ type: 'success', msg: 'ماده اولیه ذخیره شد.' });
      };

      const handleDeleteRm = (id) => {
        const item = rawMaterials.find(r => r.id === id);
        if (!window.confirm('حذف شود؟')) return;
        setRawMaterials(rawMaterials.filter(r => r.id !== id));
        logActivity('حذف ماده اولیه', `ماده اولیه ${item.name} حذف شد.`);
        setToast({ type: 'success', msg: 'حذف شد.' });
      };

      const handleUpdateStock = (id, delta) => {
        setRawMaterials(rawMaterials.map(r => r.id === id ? { ...r, currentStock: Math.max(0, r.currentStock + delta), lastUpdate: todayFa() } : r));
      };

      const addOrderToCart = () => {
        if (!selectedOrder) return setToast({ type: 'error', msg: 'کالا را انتخاب کنید.' });
        const qty = Number(shipmentQty);
        if (!qty || qty <= 0) return setToast({ type: 'error', msg: 'مقدار معتبر وارد کنید.' });
        const existing = shipmentCart.find(c => c.code === selectedOrder && c.source === 'order');
        if (existing) setShipmentCart(shipmentCart.map(c => c.code === selectedOrder && c.source === 'order' ? { ...c, qty: c.qty + qty } : c));
        else setShipmentCart([...shipmentCart, { code: selectedOrder, qty, source: 'order' }]);
        setShipmentQty(''); setSelectedOrder('');
        setToast({ type: 'success', msg: 'به لیست اضافه شد.' });
      };

      const addNewProductToCart = () => {
        if (!newProduct.code || !newProduct.name) return setToast({ type: 'error', msg: 'کد و نام کالا را وارد کنید.' });
        const qty = Number(newProduct.qty);
        if (!qty || qty <= 0) return setToast({ type: 'error', msg: 'مقدار معتبر وارد کنید.' });
        const newItem = {
          code: newProduct.code,
          name: newProduct.name,
          unit: newProduct.unit,
          qty: qty,
          source: 'new',
          isNewProduct: true
        };
        setShipmentCart([...shipmentCart, newItem]);
        setNewProduct({ code: '', name: '', unit: 'عدد', qty: '' });
        setToast({ type: 'success', msg: 'کالای جدید به لیست اضافه شد.' });
      };

      const submitShipment = () => {
        if (!perms.createShipment || shipmentCart.length === 0) return;
        
        let updatedOrders = [...orders];
        const items = [];

        // اعمال منطق FIFO برای هر آیتم سبد
        shipmentCart.forEach(cartItem => {
          if (cartItem.source === 'new') {
            items.push({ code: cartItem.code, name: cartItem.name, qty: cartItem.qty, unit: cartItem.unit, isNewProduct: true });
            // ثبت یک سفارش جدید مجازی برای کالای جدید تا در تاریخچه بماند
            const newOrder = {
              row: Date.now(),
              code: cartItem.code,
              order_name: cartItem.name,
              output_name: cartItem.name,
              unit: cartItem.unit,
              total_order: 0,
              prev_sent: 0,
              new_sent: cartItem.qty,
              total_sent: cartItem.qty,
              remaining: 0,
              excess: cartItem.qty,
              status: 'ارسال مازاد',
              notes: 'ثبت شده از طریق حواله خروج',
              invoiceId: 'MANUAL-' + Date.now(),
              invoiceDate: todayFa()
            };
            updatedOrders.push(newOrder);
          } else {
            // اعمال FIFO
            updatedOrders = applyFIFO(updatedOrders, cartItem.code, cartItem.qty);
            const o = orders.find(x => x.code === cartItem.code);
            items.push({ code: o.code, name: o.output_name, qty: cartItem.qty, unit: o.unit });
          }
        });

        setOrders(updatedOrders);
        
        const newLog = {
          id: Date.now(),
          date: todayFa(),
          docNo: 'HV-' + Math.floor(1000 + Math.random() * 9000),
          recipient: recipientName,
          itemsCount: items.length,
          status: 'ثبت قطعی',
          items,
          createdBy: users[role].label
        };
        
        setOutboundLogs([newLog, ...outboundLogs]);
        logActivity('صدور حواله', `حواله ${newLog.docNo} برای ${recipientName} صادر شد.`);
        setPrintData(newLog);
        setShipmentCart([]);
        setToast({ type: 'success', msg: 'حواله صادر و از سفارشات کسر شد.' });
      };

      const handleDeleteShipment = (log) => {
        if (!window.confirm(`آیا از حذف حواله ${log.docNo} مطمئن هستید؟`)) return;
        setOutboundLogs(outboundLogs.filter(l => l.id !== log.id));
        logActivity('حذف حواله', `حواله ${log.docNo} حذف شد.`);
        setToast({ type: 'success', msg: 'حواله حذف شد.' });
      };

      const printVoucher = (data) => {
        if (!data) return;
        const rows = data.items.map(it => `<tr><td style="padding:8px;border:1px solid #ddd;">${it.code}</td><td style="padding:8px;border:1px solid #ddd;">${it.name}${it.isNewProduct ? ' <span style="color:#10b981;font-size:10px;">[جدید]</span>' : ''}</td><td style="padding:8px;border:1px solid #ddd;text-align:center;font-weight:bold;">${fmt(it.qty)} ${it.unit}</td></tr>`).join('');
        const html = `<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><title>حواله ${data.docNo}</title><link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"><style>@page { size: A4; margin: 15mm; } body { font-family: 'Vazirmatn', Tahoma; } .header { border-bottom: 2px solid #1e293b; padding-bottom: 14px; margin-bottom: 18px; display: flex; justify-content: space-between; } table { width: 100%; border-collapse: collapse; font-size: 13px; } thead th { background: #1e293b; color: #fff; padding: 10px; text-align: right; } .signatures { display: flex; justify-content: space-between; margin-top: 60px; } .signatures div { border-top: 1px dashed #94a3b8; padding-top: 8px; width: 30%; text-align: center; } .toolbar { background: #1e293b; color: white; padding: 12px; text-align: center; } .toolbar button { background: #10b981; color: white; border: 0; padding: 8px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: inherit; } @media print { .toolbar { display: none; } }</style></head><body><div class="toolbar"><button onclick="window.print()">🖨️ چاپ</button></div><div style="padding: 20px;"><div class="header"><div><h1 style="margin:0;font-size:20px;">شرکت زرین‌فلز</h1><div style="font-size:12px;color:#475569;">تحویل به: تاکنوگاز</div></div><div style="text-align:left;font-size:12px;"><div>شماره: <strong>${data.docNo}</strong></div><div>تاریخ: ${data.date}</div><div>صادرکننده: ${data.createdBy || '-'}</div></div></div><div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-bottom:16px;font-size:13px;"><strong>مقصد:</strong> ${data.recipient}</div><table><thead><tr><th>کد</th><th>شرح کالا</th><th style="text-align:center;">مقدار</th></tr></thead><tbody>${rows}</tbody></table><div class="signatures"><div>تحویل‌دهنده</div><div>تحویل‌گیرنده</div><div>مدیر انبار</div></div></div><script>window.onload=function(){setTimeout(function(){window.print();},500);}<\/script></body></html>`;
        
        try {
          const win = window.open('', '_blank', 'width=900,height=750');
          if (win && win.document) { win.document.open(); win.document.write(html); win.document.close(); return; }
        } catch (e) {}
        const iframe = document.createElement('iframe');
        iframe.style.position = 'absolute'; iframe.style.width = '0'; iframe.style.height = '0'; iframe.style.border = '0';
        document.body.appendChild(iframe);
        const doc = iframe.contentWindow.document;
        doc.open(); doc.write(html); doc.close();
        setTimeout(() => { iframe.contentWindow.focus(); iframe.contentWindow.print(); setTimeout(() => document.body.removeChild(iframe), 2000); }, 800);
      };

      // ============ LOGIN ============
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-8">
              <div className="bg-amber-500 w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-slate-900 shadow-lg mb-4">
                <Icon name="lock" className="w-8 h-8" />
              </div>
              <h1 className="text-xl font-black text-slate-900 text-center mb-1">ورود به سامانه</h1>
              <p className="text-xs text-slate-500 text-center mb-6">رمز عبور خود را وارد کنید</p>
              <form onSubmit={handleLogin}>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="رمز عبور" autoFocus className={"w-full p-3 mb-3 bg-slate-50 border rounded-xl text-center tracking-widest outline-none transition " + (error ? 'border-rose-500' : 'border-slate-200')} />
                {error && <p className="text-rose-500 text-xs mb-3 text-center font-bold">رمز نامعتبر است.</p>}
                <button type="submit" className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl">ورود</button>
              </form>
              <div className="mt-6 pt-4 border-t border-slate-100 text-[10px] text-slate-400 space-y-1 text-center">
                <p className="font-bold text-slate-500 mb-1">راهنمای تست:</p>
                <p>مدیر: <strong>1000</strong> | بازرگانی: <strong>2000</strong> | انباردار: <strong>3000</strong> | تولید: <strong>4000</strong></p>
              </div>
            </div>
          </div>
        );
      }

      // ============ MAIN ============
      const roleColor = { manager: 'bg-purple-500 text-white', commercial: 'bg-amber-500 text-slate-900', warehouse: 'bg-blue-500 text-white', production: 'bg-emerald-500 text-white' }[role];
      const roleBg = { manager: 'bg-purple-50 border-purple-500 text-purple-900', commercial: 'bg-amber-50 border-amber-500 text-amber-900', warehouse: 'bg-blue-50 border-blue-500 text-blue-900', production: 'bg-emerald-50 border-emerald-500 text-emerald-900' }[role];

      return (
        <div dir="rtl" className="min-h-screen bg-slate-50 text-slate-800 pb-12">
          {toast && (
            <div className={"fixed top-4 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-xl shadow-2xl text-sm font-bold " + (toast.type === 'success' ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white')}>{toast.msg}</div>
          )}

          <header className="bg-slate-900 text-white shadow-xl sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="bg-amber-500 p-2 rounded-lg text-slate-900"><Icon name="building" className="w-6 h-6" /></div>
                <div>
                  <h1 className="text-lg font-black">سامانه جامع زرین‌فلز</h1>
                  <p className="text-[10px] text-slate-400">مدیریت انبار و مکاتبات</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <div className={"px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 " + roleColor}>
                  <Icon name="shield" className="w-3.5 h-3.5" /> {users[role].label}
                </div>
                <button onClick={() => setChangePassMode(true)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-2 rounded-lg text-xs font-bold" title="تغییر رمز"><Icon name="lock" className="w-3.5 h-3.5" /></button>
                <button onClick={handleLogout} className="bg-rose-600/20 text-rose-300 hover:bg-rose-600/40 px-3 py-2 rounded-xl text-xs font-bold">خروج</button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 mt-6">
            <div className={"p-3 rounded-xl mb-4 flex items-center gap-3 border-r-4 " + roleBg}>
              <Icon name="shield" className="w-5 h-5" />
              <div>
                <h4 className="font-bold text-sm">نقش: {users[role].label}</h4>
                <p className="text-[11px] opacity-80">
                  {role === 'manager' && 'دسترسی کامل به داشبورد، سفارشات، مواد اولیه، ثبت خروجی و کارتابل.'}
                  {role === 'commercial' && 'دسترسی به داشبورد، سفارشات، مدیریت مواد اولیه و کارتابل.'}
                  {role === 'warehouse' && 'دسترسی به سفارشات (محدود)، موجودی انبار، ثبت خروجی و کارتابل.'}
                  {role === 'production' && 'دسترسی به کارتابل نامه‌های درون‌سازمانی.'}
                </p>
              </div>
            </div>

            <div className="flex border-b border-slate-200 mb-6 gap-2 overflow-x-auto">
              {perms.dashboard && <button onClick={() => setActiveTab('dashboard')} className={"px-4 py-2 font-bold text-sm border-b-2 whitespace-nowrap flex items-center gap-1.5 " + (activeTab === 'dashboard' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500')}><Icon name="pie" className="w-4 h-4" /> داشبورد</button>}
              <button onClick={() => setActiveTab('orders')} className={"px-4 py-2 font-bold text-sm border-b-2 whitespace-nowrap " + (activeTab === 'orders' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500')}>سفارشات</button>
              <button onClick={() => setActiveTab('rm')} className={"px-4 py-2 font-bold text-sm border-b-2 whitespace-nowrap flex items-center gap-1.5 " + (activeTab === 'rm' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500')}><Icon name="layers" className="w-4 h-4" /> موجودی انبار</button>
              {perms.createShipment && <button onClick={() => setActiveTab('outbound')} className={"px-4 py-2 font-bold text-sm border-b-2 whitespace-nowrap " + (activeTab === 'outbound' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500')}>ثبت خروجی</button>}
              <button onClick={() => setActiveTab('letters')} className={"px-4 py-2 font-bold text-sm border-b-2 whitespace-nowrap flex items-center gap-1.5 " + (activeTab === 'letters' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500')}><Icon name="mail" className="w-4 h-4" /> کارتابل</button>
              {perms.tabs.includes('logs') && <button onClick={() => setActiveTab('logs')} className={"px-4 py-2 font-bold text-sm border-b-2 whitespace-nowrap flex items-center gap-1.5 " + (activeTab === 'logs' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500')}><Icon name="clock" className="w-4 h-4" /> تاریخچه</button>}
            </div>

            {activeTab === 'dashboard' && perms.dashboard && <Dashboard orders={orders} rawMaterials={rawMaterials} />}
            {activeTab === 'letters' && <Letters currentRole={role} letters={letters} setLetters={setLetters} users={users} />}

            {activeTab === 'logs' && perms.tabs.includes('logs') && (
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                <h3 className="font-bold text-sm mb-3 flex items-center gap-2"><Icon name="clock" className="w-4 h-4 text-indigo-600" /> تاریخچه فعالیت‌ها</h3>
                <div className="space-y-2">
                  {activityLogs.length === 0 ? <p className="text-xs text-slate-400 text-center py-8">فعالیتی ثبت نشده.</p> : activityLogs.map(log => (
                    <div key={log.id} className="flex justify-between items-center bg-slate-50 p-2 rounded text-xs border border-slate-100">
                      <div>
                        <span className="font-bold text-slate-800">{log.action}</span>
                        <span className="text-slate-500 mr-2">- {log.details}</span>
                      </div>
                      <div className="text-[10px] text-slate-400">
                        {log.user} | {log.date}
                      </div>
                    </div>
                  ))}

                <div className="grid grid-cols-2 gap-3">
                  <Field label="کد سفارش"><input value={editOrder.invoiceId} onChange={e => setEditOrder({...editOrder, invoiceId: e.target.value})} className="w-full p-2 border rounded" /></Field>
                  <Field label="تاریخ سفارش"><input value={editOrder.invoiceDate} onChange={e => setEditOrder({...editOrder, invoiceDate: e.target.value})} className="w-full p-2 border rounded" /></Field>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <Field label="کد کالا"><input value={editOrder.code} onChange={e => setEditOrder({...editOrder, code: e.target.value})} className="w-full p-2 border rounded" /></Field>
                  <Field label="واحد"><select value={editOrder.unit} onChange={e => setEditOrder({...editOrder, unit: e.target.value})} className="w-full p-2 border rounded bg-white"><option>عدد</option><option>کیلوگرم</option><option>متر</option><option>لیتر</option></select></Field>
                </div>
                <Field label="نام سفارش"><input value={editOrder.order_name} onChange={e => setEditOrder({...editOrder, order_name: e.target.value})} className="w-full p-2 border rounded" /></Field>
                <Field label="نام خروجی"><input value={editOrder.output_name} onChange={e => setEditOrder({...editOrder, output_name: e.target.value})} className="w-full p-2 border rounded" /></Field>
                <div className="grid grid-cols-3 gap-2">
                  <Field label="مجموع"><input type="number" value={editOrder.total_order} onChange={e => setEditOrder({...editOrder, total_order: Number(e.target.value)})} className="w-full p-2 border rounded" /></Field>
                  <Field label="ارسالی"><input type="number" value={editOrder.total_sent} onChange={e => setEditOrder({...editOrder, total_sent: Number(e.target.value)})} className="w-full p-2 border rounded" /></Field>
                  <Field label="مانده"><input type="number" value={editOrder.remaining} onChange={e => setEditOrder({...editOrder, remaining: Number(e.target.value)})} className="w-full p-2 border rounded" /></Field>
                </div>
                <Field label="یادداشت"><input value={editOrder.notes || ''} onChange={e => setEditOrder({...editOrder, notes: e.target.value})} className="w-full p-2 border rounded" /></Field>
                <div className="flex justify-end gap-2 pt-2 border-t"><button type="button" onClick={() => setEditOrder(null)} className="px-4 py-2 bg-slate-100 rounded font-bold">انصراف</button><button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded font-bold">ذخیره</button></div>
              </form>
            </Modal>
          )}

          {editRm && perms.manageRM && (
            <Modal onClose={() => setEditRm(null)} title={editRm.id ? "ویرایش ماده اولیه" : "تعریف ماده اولیه"}>
              <form onSubmit={handleSaveRm} className="space-y-3 text-xs">
                <div className="grid grid-cols-2 gap-2">
                  <Field label="کد" required><input required value={rmForm.code} onChange={e => setRmForm({...rmForm, code: e.target.value})} className="w-full p-2 border rounded" /></Field>
                  <Field label="واحد" required><select value={rmForm.unit} onChange={e => setRmForm({...rmForm, unit: e.target.value})} className="w-full p-2 border rounded bg-white"><option>کیلوگرم</option><option>متر</option><option>عدد</option><option>لیتر</option><option>متر مربع</option></select></Field>
                </div>
                <Field label="نام" required><input required value={rmForm.name} onChange={e => setRmForm({...rmForm, name: e.target.value})} className="w-full p-2 border rounded" /></Field>
                <div className="grid grid-cols-2 gap-2">
                  <Field label="حداقل ایمن" required><input type="number" required value={rmForm.minStock} onChange={e => setRmForm({...rmForm, minStock: e.target.value})} className="w-full p-2 border rounded" /></Field>
                  <Field label="موجودی فعلی" required><input type="number" required value={rmForm.currentStock} onChange={e => setRmForm({...rmForm, currentStock: e.target.value})} className="w-full p-2 border rounded" /></Field>
                </div>
                <div className="bg-amber-50 border border-amber-200 rounded p-2 text-[10px] text-amber-800">نقطه سفارش خودکار (۳۰٪): <strong>{fmt(calcRP(Number(rmForm.minStock) || 0))}</strong></div>
                <Field label="تامین‌کننده"><input value={rmForm.supplier} onChange={e => setRmForm({...rmForm, supplier: e.target.value})} className="w-full p-2 border rounded" /></Field>
                <div className="flex justify-end gap-2 pt-2 border-t"><button type="button" onClick={() => setEditRm(null)} className="px-4 py-2 bg-slate-100 rounded font-bold">انصراف</button><button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded font-bold">ذخیره</button></div>
              </form>
            </Modal>
          )}

          {printData && (
            <Modal onClose={() => setPrintData(null)} title="پیش‌نمایش حواله" wide>
              <div className="text-xs space-y-2 mb-4">
                <p><strong>سند:</strong> {printData.docNo}</p>
                <p><strong>گیرنده:</strong> {printData.recipient}</p>
                <p><strong>صادرکننده:</strong> {printData.createdBy || '-'}</p>
                <table className="w-full text-right border">
                  <thead className="bg-slate-100"><tr><th className="p-2">کد</th><th className="p-2">کالا</th><th className="p-2">مقدار</th></tr></thead>
                  <tbody>{printData.items.map((it, i) => <tr key={i} className="border-t"><td className="p-2">{it.code}</td><td className="p-2">{it.name} {it.isNewProduct && <span className="text-[9px] text-emerald-600">[جدید]</span>}</td><td className="p-2 text-center">{fmt(it.qty)} {it.unit}</td></tr>)}</tbody>
                </table>
              </div>
              <div className="flex justify-end gap-2"><button onClick={() => setPrintData(null)} className="px-4 py-2 bg-slate-100 rounded text-xs font-bold">بستن</button><button onClick={() => printVoucher(printData)} className="px-4 py-2 bg-indigo-600 text-white rounded text-xs font-bold">چاپ</button></div>
            </Modal>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
